<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Tropicarium - Farfalle</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* Stile del pulsante Call to Action sovrapposto */
      #cta-container {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000; /* Lo tiene sopra la fotocamera */
        opacity: 0; /* Nascosto di default */
        pointer-events: none; /* Disabilitato finché non appare */
        transition: opacity 1s ease-in-out; /* Effetto dissolvenza morbido */
      }

      #cta-button {
        background-color: #ff6600; /* Arancione per convertire */
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        cursor: pointer;
      }
    </style>
  </head>
  
  <body>
    <div id="cta-container">
      <button id="cta-button" onclick="window.location.href='https://tropicarium.ticka.it/'">
        ACQUISTA BIGLIETTI
      </button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./farfalle.mp4" preload="auto" autoplay="false" loop="false" muted playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video src="#ar-video" width="1" height="2.1" position="0 0 0"></a-video>
      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const targetEntity = document.querySelector('#target-entity');
        const arVideo = document.querySelector('#ar-video');
        const ctaContainer = document.querySelector('#cta-container');
        
        let ctaTimer;

        // Quando il telefono inquadra il volantino
        targetEntity.addEventListener("targetFound", event => {
          console.log("Volantino trovato!");
          arVideo.play();
          
          // Fai apparire il bottone dopo 4.5 secondi (adattalo alla durata del volo)
          ctaTimer = setTimeout(() => {
            ctaContainer.style.opacity = "1";
            ctaContainer.style.pointerEvents = "auto";
          }, 5000); 
        });

        // Quando il telefono perde il volantino
        targetEntity.addEventListener("targetLost", event => {
          console.log("Volantino perso.");
          arVideo.pause();
          
          // Nascondi di nuovo il bottone e resetta il timer
          clearTimeout(ctaTimer);
          ctaContainer.style.opacity = "0";
          ctaContainer.style.pointerEvents = "none";
        });
      });
    </script>
  </body>
</html>
