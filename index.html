<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Tropicarium - Experience</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>

      #custom-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #a2c73b;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: sans-serif;
        color: white;
        text-align: center;
        transition: opacity 0.5s ease-in-out;
      }

      .loader-content {
        padding: 20px;
      }

      .loader-logo {
        width: 120px;
        height: auto;
        margin-bottom: 20px;
      }

      .main-title-group {
        margin-bottom: 25px;
      }
      
      .lang-it-title {
        font-size: 28px;
        color: #ffffff;
        font-weight: 800; 
        margin: 0 0 6px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      .lang-it-sub {
        font-size: 16px;
        color: #ffffff;
        margin: 0;
        font-weight: normal;
      }
      
      .secondary-translations {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 35px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 20px;
      }
      
      .lang-secondary-title {
        font-size: 16px; 
        color: #dadada;
        font-weight: 700;
        margin: 0 0 4px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      .lang-secondary-sub {
        font-size: 13px;
        color: #dadada;
        margin: 0;
        font-weight: normal;
      }

      .custom-spinner {
        margin: 0 auto;
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.1);
        border-left-color: #fdcc17;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* CTA */
      
      #cta-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease-in-out;
      }

      @keyframes pulse-soft {
        0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 102, 0, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 102, 0, 0.8); }
        100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 102, 0, 0.4); }
      }

      #cta-button {
        background: linear-gradient(135deg, #ff8c00, #ff4500);
        color: white;
        border: none;
        padding: 18px 40px;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        animation: pulse-soft 2.5s infinite ease-in-out;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  
  <body>

    <div id="custom-loader">
      <div class="loader-content">
  <img src="logo.png" alt="Tropicarium Logo" class="loader-logo" onerror="this.style.display='none';">
  
  <div class="main-title-group">
    <h2 class="lang-it-title">PREPARATI ALLA MAGIA</h2>
    <p class="lang-it-sub">Inquadra il volantino per vederlo prendere vita...</p>
  </div>
  
  <div class="secondary-translations">
    <div class="lang-block">
      <h3 class="lang-secondary-title">GET READY FOR THE MAGIC</h3>
      <p class="lang-secondary-sub">Frame the leaflet to see it come to life...</p>
    </div>
    
    <div class="lang-block">
      <h3 class="lang-secondary-title">BEREITE DICH AUF DIE MAGIE VOR</h3>
      <p class="lang-secondary-sub">Scannen Sie den Flyer, um ihn zum Leben zu erwecken...</p>
    </div>
  </div>
  
  <div class="custom-spinner"></div>
</div>
    </div>

    <div id="cta-container">
      <button id="cta-button" onclick="window.location.href='https://www.tropicarium.it/ticket'">
        TICKETS
      </button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: #no; uiLoading: #no; filterMinCF:0.001; filterBeta: 0.01;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./farfalle.mp4" preload="auto" muted playsinline loop="false"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video 
          id="ar-video-display" 
          src="#ar-video" 
          width="1" 
          height="2.1" 
          position="0 0 0" 
          opacity="0"
          transparent="true" 
          animation__fadein="property: opacity; from: 0; to: 1; dur: 1500; startEvents: startFade"
          animation__fadeout="property: opacity; from: 1; to: 0; dur: 500; startEvents: stopFade"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const sceneEl = document.querySelector('a-scene');
        const targetEntity = document.querySelector('#target-entity');
        const videoDisplay = document.querySelector('#ar-video-display');
        const arVideo = document.querySelector('#ar-video');
        const ctaContainer = document.querySelector('#cta-container');
        const customLoader = document.querySelector('#custom-loader');
        
        let ctaTimer;

        // Quando il motore AR è totalmente pronto e la fotocamera è attiva, nascondiamo il nostro loader
        sceneEl.addEventListener("arReady", () => {
          customLoader.style.opacity = "0";
          setTimeout(() => {
            customLoader.style.display = "none";
          }, 500); // Aspetta la fine della sfumatura
        });

        // Gestione errore di caricamento fotocamera o permessi negati
        sceneEl.addEventListener("arError", () => {
          document.querySelector('.loader-content p').innerText = "Errore nell'attivazione della fotocamera. Controlla i permessi.";
        });

        targetEntity.addEventListener("targetFound", () => {
          videoDisplay.emit('startFade'); 
          arVideo.play();
          
          ctaTimer = setTimeout(() => {
            ctaContainer.style.opacity = "1";
            ctaContainer.style.pointerEvents = "auto";
          }, 5000); 
        });

        targetEntity.addEventListener("targetLost", () => {
          videoDisplay.emit('stopFade'); 
          arVideo.pause();
          
          clearTimeout(ctaTimer);
          ctaContainer.style.opacity = "0";
          ctaContainer.style.pointerEvents = "none";
        });
      });
    </script>
  </body>
</html>
