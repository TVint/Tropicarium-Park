<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Tropicarium - Experience</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #cta-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease-in-out;
      }

      @keyframes pulse-soft {
        0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 102, 0, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 102, 0, 0.8); }
        100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 102, 0, 0.4); }
      }

      #cta-button {
        background: linear-gradient(135deg, #ff8c00, #ff4500);
        color: white;
        border: none;
        padding: 18px 40px;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        animation: pulse-soft 2.5s infinite ease-in-out;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>
  </head>
  
  <body>
    <div id="cta-container">
      <button id="cta-button" onclick="window.location.href='https://tropicarium.ticka.it/'">
        TICKETS
      </button>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: #no; filterMinCF:0.001; filterBeta: 0.01;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
    <a-assets>
      <video id="ar-video" src="./farfalle.mp4" preload="auto" muted playsinline loop="false"></video>
    </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video 
          id="ar-video-display" 
          src="#ar-video" 
          width="1" 
          height="2.1" 
          position="0 0 0" 
          opacity="0"
          transparent="true" 
          animation__fadein="property: opacity; from: 0; to: 1; dur: 1500; startEvents: startFade"
          animation__fadeout="property: opacity; from: 1; to: 0; dur: 500; startEvents: stopFade"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const targetEntity = document.querySelector('#target-entity');
        const videoDisplay = document.querySelector('#ar-video-display');
        const arVideo = document.querySelector('#ar-video');
        const ctaContainer = document.querySelector('#cta-container');
        
        let ctaTimer;

        targetEntity.addEventListener("targetFound", () => {
          videoDisplay.emit('startFade'); 
          arVideo.play();
          
          ctaTimer = setTimeout(() => {
            ctaContainer.style.opacity = "1";
            ctaContainer.style.pointerEvents = "auto";
          }, 5000); 
        });

        targetEntity.addEventListener("targetLost", () => {
          videoDisplay.emit('stopFade'); 
          arVideo.pause();
          
          clearTimeout(ctaTimer);
          ctaContainer.style.opacity = "0";
          ctaContainer.style.pointerEvents = "none";
        });
      });
    </script>
  </body>
</html>
